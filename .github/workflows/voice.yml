# Voice ONE approved, silent Reel of a test run with George, once, when it is chosen to go out (D-46, the user
# 2026-10-23: only a Reel ready to be published is made again with the voice; tests, searches and fixes never
# spend it). The Reel's words and exact pictures come from <reel>/_voice in that run's archive.
name: voice

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "the produce run whose archive holds the approved silent Reel (e.g. 39904752405)"
        required: true
      reel:
        description: "the Reel's folder name under output/reels (e.g. 2026-10-23_google)"
        required: true
      artifact:
        description: "that run's archive name"
        default: "kavar-dryrun"

permissions:
  contents: write  # D-49: deliver.sh
  actions: read

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
      PYTHONIOENCODING: utf-8
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}  # second account, same George (D-23)
      ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}  # third account, same George (D-46)
      ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}  # fourth account, same George (user 2026-11-04)
      GH_TOKEN: ${{ github.token }}
      # D-68 (user 11-12): George learns a new name here too (tts_engine asks Claude); before, a name missing from
      # rules/pronunciation.json stopped the run (42859526056, 43164086698)
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Cloud runner (drop the PC-only hook, D-49)
        run: rm -f .claude/settings.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: System packages (ffmpeg)
        timeout-minutes: 20
        run: bash .github/apt_install.sh ffmpeg && command -v ffmpeg
      - name: Python packages and Chromium
        run: |
          pip install -q -r requirements.txt -c constraints.txt
          python -m playwright install --with-deps chromium
      - name: Claude Code CLI and HyperFrames
        run: |
          for i in 1 2 3; do
            npm install -g @anthropic-ai/claude-code@2.1.301 && claude --version && break
            npm uninstall -g @anthropic-ai/claude-code || true
          done
          npx --yes hyperframes@0.8.145 --version || true
      - name: Fonts
        run: |
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o /tmp/inter.zip -d /tmp/inter
          mkdir -p templates/hyperframes_news/assets/fonts
          cp "$(find /tmp/inter -name 'Inter-Black.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguibl.ttf
          cp "$(find /tmp/inter -name 'Inter-SemiBold.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguisb.ttf
      - name: The approved silent Reel from its run
        run: |
          gh run download "${{ github.event.inputs.run_id }}" -n "${{ github.event.inputs.artifact }}" -D /tmp/arc
          tar -xzf "$(find /tmp/arc -name '*.tgz' | head -1)" "output/reels/${{ github.event.inputs.reel }}"
          test -f "output/reels/${{ github.event.inputs.reel }}/_voice/capture.json"
      - name: Voice it with George (once) and check it
        run: python src/voice_kept.py "output/reels/${{ github.event.inputs.reel }}"
      - name: Upload-size copy (Business Suite in the browser takes at most 10 MB)
        run: bash .github/upload_size.sh "output/reels/${{ github.event.inputs.reel }}"
      # D-49: the artifact storage quota lost a whole day on 10-24; a failed upload goes to a release (out-<run id>)
      - uses: actions/upload-artifact@v7
        id: up
        continue-on-error: true
        with:
          name: kavar-voiced
          if-no-files-found: error
          path: |
            output/reels/${{ github.event.inputs.reel }}/upload.mp4
            output/reels/${{ github.event.inputs.reel }}/final_video.mp4
            output/reels/${{ github.event.inputs.reel }}/cover.jpg
            output/reels/${{ github.event.inputs.reel }}/post.json
          retention-days: 3
      - name: By release (the artifact upload failed)
        if: steps.up.outcome == 'failure'
        run: |
          tar -czf voiced-${{ github.event.inputs.reel }}.tgz output/reels/${{ github.event.inputs.reel }}/upload.mp4 output/reels/${{ github.event.inputs.reel }}/final_video.mp4 output/reels/${{ github.event.inputs.reel }}/cover.jpg output/reels/${{ github.event.inputs.reel }}/post.json
          bash .github/deliver.sh voiced-*.tgz
      # D-66: test runs commit no state, so a test Reel voiced for publishing records its tool here
      - name: Remember the tool (production never makes it again)
        run: |
          python -c "import json,sys; sys.path.insert(0,'src'); import script_writer as s; s.remember_tool(json.load(open(sys.argv[1], encoding='utf-8')).get('tool_name',''))" "output/reels/${{ github.event.inputs.reel }}/post.json"
          git config user.name "kavar-bot"
          git config user.email "kavar-bot@users.noreply.github.com"
          git checkout -- .claude/settings.json
          git add state/used_tools.json state/pronunciations.json state/claude_usage.jsonl
          git diff --cached --quiet || (git commit -q -m "state: used tool from voice.yml (${{ github.event.inputs.reel }})" && git pull --rebase --autostash -q && git push -q)
