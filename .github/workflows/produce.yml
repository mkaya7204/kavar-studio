# Daily cloud production for KAVAR (@thekavar.ai): the same `python daily.py produce` the PC ran,
# on a GitHub-hosted Linux machine (7 GB RAM) instead of the 4 GB PC.
#   - 06:30 Turkey time (03:30 UTC); GitHub may start scheduled runs some minutes late.
#   - Output (queue, carousels, Reels with covers, logs) is packed into one archive artifact;
#     on the PC `python daily.py fetch` downloads it, then the posts are scheduled in Meta Business Suite.
#   - state/ (used news, recent hooks, Reel metrics) is committed back so tomorrow's run sees it.
# Secrets (repo Settings -> Secrets and variables -> Actions), entered by the owner:
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (script writing, hook judge, editor review)
#   ELEVENLABS_API_KEY       voiceover (George only, CLAUDE.md §1.6)
#   OPENROUTER_API_KEY       "Biz denedik": free language-model tests (free OpenRouter account); optional
#   HF_TOKEN                 "Biz denedik": more free GPU time for image-model Spaces (free HF account); optional
name: produce

on:
  # GitHub starts scheduled runs late or skips them (hours late on 10-13/14/15), so three tries.
  # The first that produces something writes state/last_produce.json; the later ones see it in
  # the guard step and stop within seconds. Minutes avoid :00/:30 (GitHub's busiest marks).
  schedule:
    - cron: "17 3 * * *"   # 06:17 TRT
    - cron: "47 4 * * *"   # 07:47 TRT, if the first was skipped or produced nothing
    - cron: "17 6 * * *"   # 09:17 TRT, last try
  workflow_dispatch:
    inputs:
      only:
        description: "all | next (first stage not done today) | morning (07:30 guide Reel) | rest | reel | news"
        default: all
      dry:
        description: "yes = full test run: nothing is committed, and the archive is not today's (fetch ignores it)"
        default: "no"
      auto:
        description: "yes = the daily start from cron-job.org (D-25): behaves like a scheduled run and skips a day already produced"
        default: "no"

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TZ: Europe/Istanbul
      PYTHONIOENCODING: utf-8
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}  # second account, same George (D-23)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # a late scheduled run must not redo a day already produced by hand (state/last_produce.json)
      KAVAR_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto != 'yes' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # scheduled runs: main's newest commit (they must see the state an earlier run pushed);
          # manual runs: the branch they were started on
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      - name: Guard (scheduled and cron-job.org runs skip a day that is already produced)
        id: guard
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.auto }}" = "yes" ]; } && python3 -c "import json,datetime,sys; m=json.load(open('state/last_produce.json')); d=m.get('stages',['morning','rest']) if m.get('date')==datetime.date.today().isoformat() else []; sys.exit(0 if {'morning','rest'} <= set(d) else 1)" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "today is already produced; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: System packages (ffmpeg)
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Python packages and Chromium
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Claude Code CLI and HyperFrames
        if: steps.guard.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            npm install -g @anthropic-ai/claude-code@2.1.301 && claude --version && break
            echo "Claude Code CLI install broken (try $i), reinstalling"; npm uninstall -g @anthropic-ai/claude-code || true
          done
          claude --version  # fail here, not later in the run, if all tries broke
          npx --yes hyperframes@0.8.145 --version || true

      - name: Fonts (Inter, OFL - stands in for Windows-only Segoe UI under the template's file names)
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o /tmp/inter.zip -d /tmp/inter
          mkdir -p templates/hyperframes_news/assets/fonts
          cp "$(find /tmp/inter -name 'Inter-Black.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguibl.ttf
          cp "$(find /tmp/inter -name 'Inter-SemiBold.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguisb.ttf
          ls -la templates/hyperframes_news/assets/fonts

      - name: Invariant tests (a red result is logged; production still runs, the editor still gates)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: pip install -q pytest pyyaml && python -m pytest -q tests

      - name: Produce (news carousels + Reel, each reviewed by the editor)
        if: steps.guard.outputs.skip != 'true'
        run: python daily.py produce ${{ github.event.inputs.only != 'all' && github.event.inputs.only || '' }}

      - name: Upload-size copies (Business Suite in the browser takes at most 10 MB)
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          for IN in output/reels/$(date +%F)_*/final_video.mp4; do
            [ -f "$IN" ] || continue
            OUT="$(dirname "$IN")/upload.mp4"
            if [ "$(stat -c %s "$IN")" -le 9500000 ]; then cp "$IN" "$OUT"; continue; fi
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$IN")
            V=$(python3 -c "print(int(9.0*8*1024/$D - 128))")
            ffmpeg -y -loglevel error -i "$IN" -c:v libx264 -preset slow -b:v ${V}k -pass 1 -an -f mp4 /dev/null
            ffmpeg -y -loglevel error -i "$IN" -c:v libx264 -preset slow -b:v ${V}k -pass 2 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart "$OUT"
            ls -la "$IN" "$OUT"
          done

      - name: Pack today's output
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          D=$(date +%F)
          tar -czf kavar-$D.tgz --ignore-failed-read output/queue output/logs \
            $(ls -d output/carousel/${D}_* output/reels/${D}_* 2>/dev/null)
          ls -la kavar-$D.tgz

      - uses: actions/upload-artifact@v7
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: ${{ github.event.inputs.dry == 'yes' && 'kavar-dryrun' || 'kavar-output' }}
          path: kavar-*.tgz
          retention-days: 7

      - name: Save state (used news, recent hooks, Reel metrics)
        if: always() && steps.guard.outputs.skip != 'true' && github.event.inputs.dry != 'yes'
        run: |
          git config user.name "kavar-bot"
          git config user.email "kavar-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -q -m "state: $(date +%F) production" && git pull --rebase -q && git push -q)
