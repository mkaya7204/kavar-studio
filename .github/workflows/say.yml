# One short sentence spoken by George, to check how names are pronounced (D-34, rules/pronunciation.json).
# Spends only the sentence's characters.   gh workflow run say.yml -f text="..."   then download "say"
name: say

on:
  workflow_dispatch:
    inputs:
      text:
        description: "sentence to speak (short)"
        required: true

jobs:
  say:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # learns new names (D-34)
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
      ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}  # third account, same George (D-46)
      SAY_TEXT: ${{ github.event.inputs.text }}
    steps:
      - uses: actions/checkout@v7
      # D-49: the PC hook (.claude/settings.json) calls a Windows path; here it fails and blocks every Bash call
      - name: Cloud runner (drop the PC-only hook)
        run: rm -f .claude/settings.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: bash .github/apt_install.sh ffmpeg && pip install -q -r requirements.txt && npm install -g @anthropic-ai/claude-code@2.1.301
      - name: Speak
        run: |
          python -c "import os,sys,json; sys.path.insert(0,'src'); import tts_engine as t; s=os.environ['SAY_TEXT']; r=t.synthesize(s, out_path='output/say/say.mp3', voice=t.voice_for('tr')); print(json.dumps(r, ensure_ascii=False)); print('known:', json.dumps(t._lexicon(), ensure_ascii=False)); print(open('output/say/say_words.json',encoding='utf-8').read()[:800])"
      - uses: actions/upload-artifact@v7
        with:
          name: say
          path: output/say/
          retention-days: 3
