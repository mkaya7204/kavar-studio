# Make one news carousel from a given article URL in the cloud, to try a change (e.g. "Biz denedik")
# before it runs in the daily production. Nothing is queued, published or committed.
#   gh workflow run news-test.yml -f url=<article url>      then download the "news-test" artifact
name: news-test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "article URL"
        required: true
      reel:
        description: "also make the Biz denedik Reel from it (yes / no)"
        default: "no"

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Europe/Istanbul
      PYTHONIOENCODING: utf-8
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}  # second account, same George (D-23)
      ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}  # third account, same George (D-46)
    steps:
      - uses: actions/checkout@v7
      # D-49: the PC hook (.claude/settings.json) calls a Windows path; here it fails and blocks every Bash call
      - name: Cloud runner (drop the PC-only hook)
        run: rm -f .claude/settings.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Python packages, Chromium and Claude Code CLI
        run: |
          bash .github/apt_install.sh ffmpeg
          mkdir -p output
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          for i in 1 2 3; do
            npm install -g @anthropic-ai/claude-code@2.1.301 && claude --version && break
            echo "Claude Code CLI install broken (try $i), reinstalling"; npm uninstall -g @anthropic-ai/claude-code || true
          done
          claude --version  # fail here, not later in the run, if all tries broke
          npx --yes hyperframes@0.8.145 --version || true

      - name: Fonts (same as produce.yml)
        run: |
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o /tmp/inter.zip -d /tmp/inter
          mkdir -p templates/hyperframes_news/assets/fonts
          cp "$(find /tmp/inter -name 'Inter-Black.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguibl.ttf
          cp "$(find /tmp/inter -name 'Inter-SemiBold.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguisb.ttf

      - name: Today's candidates in the order daily.py would try them (testable models first)
        run: |
          python -c "import sys; sys.path.insert(0,'src'); from news_fetcher import fetch_news; from model_trial import testable_first; [print(i, c['source'], '|', c['title']) for i, c in enumerate(testable_first(fetch_news(12)))]" 2>&1 | tee output/news-test.log

      - name: News carousel
        run: python carousel.py --news-url "${{ github.event.inputs.url }}" 2>&1 | tee -a output/news-test.log

      - name: Editor review
        if: always()
        run: |
          D=$(ls -d output/carousel/*_haber-* 2>/dev/null | head -1)
          [ -n "$D" ] && python -c "import sys,json; sys.path.insert(0,'src'); from pathlib import Path; from editor_review import review_carousel; print(json.dumps(review_carousel(Path('$D')), indent=1, ensure_ascii=False))" 2>&1 | tee -a output/news-test.log || true

      - name: Biz denedik Reel + editor review
        if: github.event.inputs.reel == 'yes'
        env:
          KAVAR_DRAFT_VOICE: "1"  # D-46 (user 10-23): a test never spends George; only a Reel going out is voiced
        run: |
          D=$(ls -d output/carousel/*_haber-* | head -1)
          python src/trial_reel.py "$D" 2>&1 | tee output/reel-test.log
          # no test output of ours -> no Reel, nothing to review (10-19 crashed here on a missing script.json)
          if [ ! -f output/temp/script.json ] || [ ! -f output/final/final_video.mp4 ]; then
            echo "no Biz denedik Reel: the trial gave no usable output" | tee -a output/reel-test.log; exit 0
          fi
          python -c "import sys,json; sys.path.insert(0,'src'); from pathlib import Path; from editor_review import review_reel; v=Path('output/final/final_video.mp4'); print(json.dumps(review_reel(v, json.load(open('output/temp/script.json',encoding='utf-8')), json.load(open('output/temp/tool.json',encoding='utf-8'))), indent=1, ensure_ascii=False))" 2>&1 | tee -a output/reel-test.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: news-test
          path: |
            output/news-test.log
            output/carousel/
            output/reel-test.log
            output/final/
            output/temp/script.json
          retention-days: 3
