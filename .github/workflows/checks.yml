# Invariant tests (tests/): the user's locked decisions (CLAUDE.md §1) as code. Runs on every
# push. Red = a locked decision broke: fix the code, not the test, unless the user changed it.
name: checks

on:
  push:
    branches: ["**"]  # D-49: not on the out-<run> release tags of deliver.sh
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Python packages
        run: pip install -q -r requirements.txt pytest pyyaml
      - name: Invariant tests
        run: python -m pytest -q tests
