# Invariant tests (tests/): the user's locked decisions (CLAUDE.md §1) as code. Runs on every
# push. Red = a locked decision broke: fix the code, not the test, unless the user changed it.
name: checks

on:
  push:
    branches: ["**"]  # D-49: not on the out-<run> release tags of deliver.sh
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Python packages
        run: pip install -q -r requirements.txt -c constraints.txt pytest pyyaml
      - name: Installed versions (the source of constraints.txt, D-67)
        run: pip freeze
      - name: Invariant tests
        run: python -m pytest -q tests

  # D-85 / D-86 (user 2026-11-21: "bulutta çalıştırarak ... çalışır hale getir"): Impeccable's design detector
  # (pbakaus/impeccable, Apache-2.0, pinned) checks the carousel template for AI-made design habits
  # (glow, gradient text, eyebrow labels, low contrast, tiny text ...). No secrets in this job. A finding fails
  # the check, so a template change that brings the neon look back never reaches production.
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Impeccable detect (carousel v2 template)
        shell: bash  # -o pipefail: a finding (exit 2) fails the step through tee
        run: npx -y impeccable@4.10.0 detect --json templates/carousel_v2/index.html | tee design-findings.json
