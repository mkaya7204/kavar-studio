# Re-render one Reel in the cloud from a committed script (rerender/<name>.json): same tool, same
# words, current template. Used to fix a Reel by hand (memory: rejected-reel-workflow) without the PC.
name: rerender

on:
  workflow_dispatch:
    inputs:
      script:
        description: "script file under rerender/ (e.g. 2026-10-15_retriever-ai.json)"
        required: true
      draft:
        description: "yes (default) = silent draft voice; no = George, only for a Reel going out (D-30, D-46)"
        default: "yes"

permissions:
  contents: write  # D-49: deliver.sh

jobs:
  rerender:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Europe/Istanbul
      PYTHONIOENCODING: utf-8
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}  # second account, same George (D-23)
      ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}  # third account, same George (D-46)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      # D-49: the PC hook (.claude/settings.json) calls a Windows path; here it fails and blocks every Bash call
      - name: Cloud runner (drop the PC-only hook)
        run: rm -f .claude/settings.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: System packages (ffmpeg)
        timeout-minutes: 20
        run: bash .github/apt_install.sh ffmpeg && command -v ffmpeg
      - name: Python packages and Chromium
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Claude Code CLI and HyperFrames
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.301
          npx --yes hyperframes@0.8.145 --version || true
      - name: Fonts
        run: |
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o /tmp/inter.zip -d /tmp/inter
          mkdir -p templates/hyperframes_news/assets/fonts
          cp "$(find /tmp/inter -name 'Inter-Black.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguibl.ttf
          cp "$(find /tmp/inter -name 'Inter-SemiBold.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguisb.ttf
      - name: Render
        env:
          KAVAR_DRAFT_VOICE: ${{ github.event.inputs.draft == 'yes' && '1' || '' }}
        run: python main.py --script "rerender/${{ github.event.inputs.script }}"
      - name: Cover and last frame
        if: always()
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final/final_video.mp4)
          ffmpeg -y -loglevel error -ss "$(echo "$D - 0.5" | bc)" -i output/final/final_video.mp4 -frames:v 1 output/final/last_frame.jpg
          python -c "import sys; sys.path.insert(0,'src'); from pathlib import Path; from editor_review import make_cover; make_cover(Path('output/final/final_video.mp4'), Path('output/final'))" || true
      - name: Editor review (the same check production uses; prints the verdict)
        if: always()
        continue-on-error: true
        run: |
          python -c "import sys,json; sys.path.insert(0,'src'); from pathlib import Path; from editor_review import review_reel; v=review_reel(Path('output/final/final_video.mp4'), json.load(open('rerender/${{ github.event.inputs.script }}',encoding='utf-8')), json.load(open('output/temp/tool.json',encoding='utf-8'))); print(json.dumps(v, indent=1, ensure_ascii=False)); Path('output/final/editor.json').write_text(json.dumps(v, indent=1, ensure_ascii=False), encoding='utf-8')"
      # D-49: the artifact storage quota lost a whole day on 10-24; a failed upload goes to a release (out-<run id>)
      - uses: actions/upload-artifact@v7
        id: up
        continue-on-error: true
        if: always()
        with:
          name: rerender
          if-no-files-found: error
          path: |
            output/final/final_video.mp4
            output/final/cover.jpg
            output/final/last_frame.jpg
            output/final/post.json
            output/final/editor.json
            output/final/_review_sheet.jpg
            output/temp/proof.png
            output/temp/_proof_candidates.jpg
            output/temp/product/
          retention-days: 3
      - name: By release (the artifact upload failed)
        if: always() && steps.up.outcome == 'failure'
        run: |
          tar -czf rerender.tgz --ignore-failed-read output/final/final_video.mp4 output/final/cover.jpg \
            output/final/last_frame.jpg output/final/post.json output/final/editor.json output/final/_review_sheet.jpg
          bash .github/deliver.sh rerender.tgz
