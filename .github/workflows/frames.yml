name: frames
# Pulls still frames out of a video the user sent (style study). The video and the frames stay in a
# DRAFT release (visible only to the repo owner); the repo is public, so no workflow artifacts here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "draft release tag holding the video (asset video.mp4)"
        required: true
      every:
        description: "seconds between frames"
        default: "2"
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Get the video from the draft release
        run: gh release download "${{ inputs.tag }}" -p video.mp4 -D in
      - name: Frames
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir out
          ffmpeg -hide_banner -loglevel error -i in/video.mp4 -vf "fps=1/${{ inputs.every }},scale=720:-2" -q:v 3 out/f_%03d.jpg
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact in/video.mp4
          ls out | wc -l
          cd out && zip -q ../frames.zip *.jpg
      - name: Put the frames back into the same draft release
        run: gh release upload "${{ inputs.tag }}" frames.zip --clobber
