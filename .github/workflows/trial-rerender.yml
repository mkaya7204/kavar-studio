# Re-make a rejected "Biz denedik" Reel by hand (CLAUDE.md §1.3) from a production run's carousel:
# the same test outputs as the carousel the user will post, the current src/trial_reel.py, then the
# editor review. Nothing is queued, published or committed.
#   gh workflow run trial-rerender.yml -f run=<produce run id> -f folder=output/carousel/<date>_haber-...
name: trial-rerender

on:
  workflow_dispatch:
    inputs:
      run:
        description: "produce run id (its kavar-output artifact has the carousel)"
        required: true
      folder:
        description: "carousel folder, e.g. output/carousel/2026-10-16_haber-..."
        required: true
      script:
        description: "optional hand-fixed script under rerender/ (empty = write a new one)"
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Europe/Istanbul
      PYTHONIOENCODING: utf-8
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Python packages, Chromium and Claude Code CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          for i in 1 2 3; do
            npm install -g @anthropic-ai/claude-code && claude --version && break
            echo "Claude Code CLI install broken (try $i), reinstalling"; npm uninstall -g @anthropic-ai/claude-code || true
          done
          claude --version
          npx --yes hyperframes@0.8.145 --version || true

      - name: Fonts (same as produce.yml)
        run: |
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o /tmp/inter.zip -d /tmp/inter
          mkdir -p templates/hyperframes_news/assets/fonts
          cp "$(find /tmp/inter -name 'Inter-Black.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguibl.ttf
          cp "$(find /tmp/inter -name 'Inter-SemiBold.ttf' | head -1)" templates/hyperframes_news/assets/fonts/seguisb.ttf

      - name: The production run's carousel
        run: |
          gh run download "${{ github.event.inputs.run }}" -n kavar-output -D /tmp/kavar
          tar -xzf /tmp/kavar/kavar-*.tgz
          ls "${{ github.event.inputs.folder }}/article"

      - name: Biz denedik Reel + editor review
        run: |
          mkdir -p output/final
          S="${{ github.event.inputs.script }}"
          python src/trial_reel.py "${{ github.event.inputs.folder }}" ${S:+"rerender/$S"} 2>&1 | tee output/final/reel-test.log
          python -c "import sys,json; sys.path.insert(0,'src'); from pathlib import Path; from editor_review import review_reel, make_cover; v=Path('output/final/final_video.mp4'); print(json.dumps(review_reel(v, json.load(open('output/temp/script.json',encoding='utf-8')), json.load(open('output/temp/tool.json',encoding='utf-8'))), indent=1, ensure_ascii=False)); make_cover(v, Path('output/final'))" 2>&1 | tee -a output/final/reel-test.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trial-rerender
          path: |
            output/final/
            output/temp/script.json
          retention-days: 7
