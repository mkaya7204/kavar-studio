# Manual network check from GitHub's machines: which content sources answer the cloud run.
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Sources
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"
          for u in https://www.producthunt.com/feed https://hnrss.org/show https://openai.com/news/rss.xml \
                   https://www.theverge.com/rss/ai-artificial-intelligence/index.xml https://techcrunch.com/category/artificial-intelligence/feed/ \
                   https://api.elevenlabs.io/v1/models; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" -A "$UA" -L --max-time 20 "$u")
            echo "$code $(wc -c < /tmp/body) bytes  $u"
          done
          # Product Hunt's /r/p/ redirect to the maker's site (the feed links there)
          curl -s -A "$UA" https://www.producthunt.com/feed | grep -o 'https://www.producthunt.com/r/p/[0-9]*' | head -2 | while read r; do
            echo "redirect $r -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -A "$UA" --max-time 20 "$r")"
            echo "followed -> $(curl -s -o /dev/null -L -w '%{http_code} %{url_effective}' -A "$UA" --max-time 20 "$r")"
          done
      - name: ElevenLabs accounts (George says one word per key, ~8 credits; credits left)
        env:
          K1: ${{ secrets.ELEVENLABS_API_KEY }}
          K2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          K3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
        run: |
          for n in 1 2 3; do
            eval K=\$K$n
            [ -n "$K" ] || { echo "key $n: not set"; continue; }
            s=$(curl -s -H "xi-api-key: $K" https://api.elevenlabs.io/v1/user/subscription)
            v=$(curl -s -o /dev/null -w "%{http_code}" -H "xi-api-key: $K" https://api.elevenlabs.io/v1/voices/JBFqnCBsd6RMkjVDRZzb)
            t=$(curl -s -o /tmp/tts.json -w "%{http_code}" -X POST -H "xi-api-key: $K" -H "Content-Type: application/json"                  -d '{"text":"Merhaba.","model_id":"eleven_multilingual_v2"}'                  "https://api.elevenlabs.io/v1/text-to-speech/JBFqnCBsd6RMkjVDRZzb/with-timestamps")
            echo "key $n: George speaks 'Merhaba.' -> HTTP $t $( [ "$t" = 200 ] || head -c 200 /tmp/tts.json)"
            echo "key $n: $(echo "$s" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("tier"), "used", d.get("character_count"), "of", d.get("character_limit")) if "tier" in d else print("error", str(d)[:200])')  | George voice HTTP $v"
          done
