<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Carousel / Story</title>
    <!--
      Static carousel (1080x1350) and story (1080x1920) frames, same identity as
      templates/hyperframes_news. src/carousel_renderer.py copies this folder,
      writes assets/data.js (window.DATA) and opens index.html?mode=carousel|story.
      All slides sit side by side on one strip, so decorations can run across the
      seams (swipe-through); window.__show(i) slides the strip, then one screenshot
      per frame. window.__qa holds the layout checks measured after fitting.
    -->
    <script src="assets/data.js"></script>
    <style>
      @font-face {
        font-family: "HF Black";
        src: url("assets/fonts/seguibl.ttf") format("truetype");
        font-weight: 900;
        font-display: block;
      }
      @font-face {
        font-family: "HF Semi";
        src: url("assets/fonts/seguisb.ttf") format("truetype");
        font-weight: 600;
        font-display: block;
      }
      :root {
        --bg: #04060c;
        --panel: rgba(10, 16, 30, 0.92);
        --neon: #1fd5ff;
        --neon-deep: #0a7cff;
        --ink: #f4f8ff;
        --muted: #a9b8d0;
        --bad: #ff6b81;
        --W: 1080px;
        --H: 1350px;
        --side: 80px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: var(--W);
        height: var(--H);
        overflow: hidden;
        background: var(--bg);
      }
      body.story {
        --H: 1920px;
      }
      .black {
        font-family: "HF Black", sans-serif;
        font-weight: 900;
      }
      #strip {
        position: absolute;
        left: 0;
        top: 0;
        height: var(--H);
        background: var(--bg);
        color: var(--ink);
        font-family: "HF Semi", sans-serif;
        overflow: hidden;
      }

      /* ---------- background running across all slides ---------- */
      .bg {
        position: absolute;
        inset: 0;
      }
      #bg-grid {
        background-image:
          linear-gradient(rgba(31, 213, 255, 0.07) 2px, transparent 2px),
          linear-gradient(90deg, rgba(31, 213, 255, 0.07) 2px, transparent 2px);
        background-size: 90px 90px;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
      }
      #grain {
        opacity: 0.06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      #rail {
        /* neon line running through every seam: the swipe-through thread */
        position: absolute;
        left: 0;
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--neon) 4%, var(--neon-deep) 50%, var(--neon) 96%, transparent);
        box-shadow: 0 0 18px var(--neon);
        opacity: 0.55;
      }

      /* ---------- one frame ---------- */
      .slide {
        position: absolute;
        top: 0;
        width: var(--W);
        height: var(--H);
      }
      .content {
        position: absolute;
        left: var(--side);
        right: var(--side);
        top: 150px;
        height: 1050px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .story .content {
        top: 340px;
        height: 1240px;
      }
      .center {
        justify-content: center;
      }
      .t-title {
        line-height: 1.06;
        letter-spacing: -0.015em;
        text-wrap: balance;
        overflow-wrap: normal;
      }
      .t-title .accent {
        color: var(--neon);
        text-shadow: 0 0 26px rgba(31, 213, 255, 0.55);
      }
      .t-body {
        font-size: 40px;
        line-height: 1.4;
        color: var(--muted);
        text-wrap: pretty;
        margin-top: 32px;
      }
      .story .t-body {
        font-size: 46px;
      }
      .kicker {
        align-self: flex-start;
        padding: 10px 26px;
        border: 3px solid var(--neon);
        border-radius: 999px;
        color: var(--neon);
        font-size: 30px;
        letter-spacing: 0.12em;
        box-shadow: 0 0 22px rgba(31, 213, 255, 0.4), inset 0 0 14px rgba(31, 213, 255, 0.2);
        margin-bottom: 40px;
        white-space: nowrap;
      }
      .story .kicker,
      .story .sign-line {
        font-size: 34px;
      }
      .rule {
        display: block;
        width: 160px;
        height: 10px;
        border-radius: 5px;
        background: var(--neon);
        box-shadow: 0 0 18px var(--neon);
        margin-top: 36px;
      }

      /* ---------- brand chrome (on every frame; watermark that is part of the design) ---------- */
      .brand {
        position: absolute;
        left: var(--side);
        top: 56px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        color: var(--ink);
        opacity: 0.92;
        white-space: nowrap;
      }
      .story .brand {
        top: 262px;
      }
      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--neon);
        color: #001018;
        font-size: 26px;
        box-shadow: 0 0 16px rgba(31, 213, 255, 0.6);
        overflow: hidden;
      }
      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .brand-mark.has-logo {
        background: none;
        box-shadow: none;
      }
      .wordmark {
        display: block;
        height: 34px;
        width: auto;
      }
      .counter {
        position: absolute;
        right: var(--side);
        top: 60px;
        font-size: 28px;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .story .counter {
        top: 266px;
      }
      .progress {
        position: absolute;
        left: var(--side);
        right: var(--side);
        bottom: 64px;
        height: 6px;
        border-radius: 3px;
        overflow: hidden; /* no track of its own: it lights up the rail running underneath */
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--neon);
        box-shadow: 0 0 12px var(--neon);
      }
      .swipe {
        position: absolute;
        bottom: 96px;
        font-size: 30px;
        letter-spacing: 0.12em;
        color: var(--neon);
        white-space: nowrap;
      }

      /* ---------- device + page visuals ---------- */
      .phone {
        position: absolute;
        width: 400px;
        padding: 16px;
        border-radius: 64px;
        background: linear-gradient(160deg, #1b2335, #0a0f1a);
        border: 3px solid rgba(31, 213, 255, 0.85);
        box-shadow: 0 0 50px rgba(31, 213, 255, 0.35), 0 24px 64px rgba(0, 0, 0, 0.5);
      }
      .phone .screen {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 16;
        border-radius: 48px;
        overflow: hidden;
        background: #fff;
      }
      .phone .screen img {
        display: block;
        width: 100%;
      }
      .tag {
        position: absolute;
        padding: 8px 20px;
        border-radius: 12px;
        font-size: 28px;
        white-space: nowrap;
      }
      .tag.domain {
        background: var(--neon);
        color: #001018;
        letter-spacing: 0.04em;
      }
      .tag.mark {
        background: rgba(4, 6, 12, 0.88);
        color: var(--ink);
        border: 2px solid rgba(31, 213, 255, 0.5);
      }
      .pagecard {
        position: absolute;
        left: var(--side);
        right: var(--side);
        border-radius: 36px;
        overflow: hidden;
        background: #fff;
        border: 3px solid rgba(31, 213, 255, 0.85);
        box-shadow: 0 0 46px rgba(31, 213, 255, 0.3), 0 24px 64px rgba(0, 0, 0, 0.45);
      }
      .pagecard img {
        position: absolute;
        left: 0;
        width: 100%;
      }
      .pagecard .fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 120px;
        background: linear-gradient(180deg, transparent, rgba(4, 6, 12, 0.55));
      }

      /* ---------- roles ---------- */
      .num {
        font-size: 150px;
        line-height: 0.85;
        color: #071626;
        -webkit-text-stroke: 4px var(--neon);
        text-shadow: 0 0 30px rgba(31, 213, 255, 0.5);
        margin-bottom: 28px;
      }
      .card {
        position: relative;
        padding: 64px 60px 72px;
        border-radius: 44px;
        background: var(--panel);
        border: 3px solid rgba(31, 213, 255, 0.85);
        box-shadow: 0 0 60px rgba(31, 213, 255, 0.3), inset 0 0 40px rgba(31, 213, 255, 0.08);
      }
      .ghost {
        position: absolute;
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 5px rgba(31, 213, 255, 0.16);
        pointer-events: none;
      }
      .stat {
        line-height: 0.95;
        color: var(--neon);
        text-shadow: 0 0 40px rgba(31, 213, 255, 0.6);
        letter-spacing: -0.03em;
        margin-bottom: 36px;
        white-space: nowrap;
      }
      .cols {
        display: flex;
        gap: 24px;
        margin-top: 48px;
      }
      .col {
        flex: 1;
        min-width: 0;
        padding: 36px 32px 40px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid rgba(255, 255, 255, 0.14);
      }
      .col.good {
        background: rgba(31, 213, 255, 0.08);
        border: 3px solid var(--neon);
        box-shadow: 0 0 34px rgba(31, 213, 255, 0.25);
      }
      .col-head {
        font-size: 30px;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 26px;
        white-space: nowrap;
        overflow: hidden;
      }
      .col.good .col-head {
        color: var(--neon);
      }
      .li {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        font-size: 34px;
        line-height: 1.3;
        margin-top: 22px;
      }
      .li .ic {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-top: 0;
      }
      .ic.no {
        background: rgba(255, 107, 129, 0.16);
        color: var(--bad);
      }
      .ic.yes {
        background: var(--neon);
        color: #001018;
      }
      .col .li span:last-child {
        color: var(--muted);
      }
      .col.good .li span:last-child {
        color: var(--ink);
      }
      .checks .li {
        font-size: 44px;
        margin-top: 34px;
        padding: 28px 34px;
        border-radius: 28px;
        background: var(--panel);
        border: 2px solid rgba(31, 213, 255, 0.35);
        align-items: center;
      }
      .checks .li .ic {
        width: 56px;
        height: 56px;
        font-size: 32px;
      }
      .cta-icon {
        width: 190px;
        height: 190px;
        border-radius: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--neon);
        box-shadow: 0 0 70px rgba(31, 213, 255, 0.6);
        margin: 0 auto 56px;
      }
      .cta-actions {
        display: flex;
        gap: 22px;
        justify-content: center;
        margin-top: 48px;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 34px;
        border-radius: 999px;
        border: 3px solid var(--neon);
        color: var(--neon);
        font-size: 32px;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .sign {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin-top: 64px;
        padding-top: 48px;
        border-top: 2px solid rgba(255, 255, 255, 0.12);
      }
      .sign .brand-mark {
        width: 96px;
        height: 96px;
        border-radius: 26px;
        font-size: 54px;
      }
      .sign-text {
        text-align: left;
      }
      .sign-handle {
        font-size: 46px;
        white-space: nowrap;
      }
      .sign-line {
        font-size: 30px;
        color: var(--muted);
        margin-top: 4px;
        white-space: nowrap;
      }
      .toolchip {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 12px 28px 12px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(255, 255, 255, 0.16);
        font-size: 38px;
        margin-bottom: 36px;
        white-space: nowrap;
      }
      .toolchip .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: #04060c;
        font-size: 36px;
      }
      .toolchip .logo img {
        max-width: 80%;
        max-height: 80%;
      }
      .hint {
        position: absolute;
        left: var(--side);
        right: var(--side);
        text-align: center;
        font-size: 36px;
        letter-spacing: 0.12em;
        color: var(--neon);
        white-space: nowrap;
      }
      .zone-glow {
        position: absolute;
        left: 120px;
        right: 120px;
        border-radius: 60px;
        background: radial-gradient(ellipse at center, rgba(31, 213, 255, 0.16), transparent 70%);
      }
      .story-sign {
        position: absolute;
        left: var(--side);
        right: var(--side);
        top: 1370px;
        margin: 0;
        padding-top: 36px;
      }
      .t-body .hi {
        color: var(--neon);
        font-family: "HF Black", sans-serif;
        font-weight: 900;
      }
      .credit {
        position: absolute;
        left: var(--side);
        font-size: 26px;
        color: var(--muted);
        white-space: nowrap;
      }

      .swipe {
        position: absolute;
        right: var(--side);
        top: 1206px;
        padding: 10px 26px;
        border-radius: 999px;
        background: var(--neon, #1fd5ff);
        color: #04060c;
        font-size: 28px;
        letter-spacing: 0.08em;
      }

      /* ---------- news mode ---------- */
      .cover-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(4, 6, 12, 0.7) 0%, transparent 18%, transparent 38%, rgba(4, 6, 12, 0.88) 66%, #04060c 100%);
      }
      .bottom {
        justify-content: flex-end;
        padding-bottom: 16px; /* room for the font's descent, so it doesn't count as overflow */
      }
      .cover-blur {
        filter: blur(36px) brightness(0.45) saturate(1.2);
        transform: scale(1.25);
      }
      .cover-wide {
        position: absolute;
        left: 0;
        width: 100%;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .hl-rule {
        display: block;
        width: 72px;
        height: 6px;
        background: var(--neon);
        box-shadow: 0 0 14px var(--neon);
        margin-bottom: 28px;
      }
      .byline {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
        white-space: nowrap;
      }
      .byline .brand-mark {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        font-size: 42px;
      }
      .by-name {
        font-size: 34px;
        line-height: 1.1;
      }
      .by-handle {
        font-size: 28px;
        color: var(--muted);
      }
      .by-date {
        margin-left: auto;
        font-size: 28px;
        color: var(--muted);
      }
      .ncard {
        position: relative;
        flex: 1 1 0;
        min-height: 300px;
        margin-top: 30px;
        border-radius: 32px;
        overflow: hidden;
        background: #0a0f1a;
        border: 3px solid rgba(31, 213, 255, 0.85);
        box-shadow: 0 0 40px rgba(31, 213, 255, 0.25);
      }
      .ncard img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .ncard.fill img {
        object-fit: cover;
        object-position: 50% 0;
      }
      .ncard .tag.mark {
        right: 18px;
        bottom: 18px;
      }
      .ncard .vtag {
        left: 18px;
        top: 18px;
        background: var(--neon);
        color: #001018;
      }
      .ncredit {
        font-size: 26px;
        color: var(--muted);
        margin-top: 14px;
        white-space: nowrap;
        overflow: hidden;
      }
      .follow-btn {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 22px 56px;
        border-radius: 999px;
        background: var(--neon);
        color: #001018;
        font-size: 44px;
        letter-spacing: 0.04em;
        box-shadow: 0 0 50px rgba(31, 213, 255, 0.6);
        margin: 44px auto 0;
      }
    </style>
  </head>
  <body>
    <div id="strip">
      <div id="bg-grid" class="bg"></div>
      <div id="orbs" class="bg"></div>
      <div id="grain" class="bg"></div>
      <i id="rail"></i>
      <div id="slides"></div>
    </div>

    <script>
      (function () {
        const D = window.DATA;
        const STORY = new URLSearchParams(location.search).get("mode") === "story";
        const W = 1080;
        const H = STORY ? 1920 : 1350;
        const MIN_FONT = STORY ? 32 : 28;
        const MIN_CHROME = 26;
        if (STORY) document.body.classList.add("story");
        document.documentElement.style.setProperty("--H", H + "px");
        const frames = STORY ? D.story : D.slides;
        const N = frames.length;
        const up = (s) => String(s || "").toLocaleUpperCase("tr-TR");
        const strip = document.getElementById("strip");
        strip.style.width = N * W + "px";

        // ---- helpers ----
        function el(tag, cls, parent, text) {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text !== undefined) e.textContent = text;
          if (parent) parent.appendChild(e);
          return e;
        }
        // Title with accent words in neon; `sizes` are the allowed font sizes, largest first.
        function title(parent, text, accent, sizes, upper) {
          const h = el("h2", "t-title black", parent);
          const t = upper ? up(text) : String(text || "");
          const a = accent ? (upper ? up(accent) : accent) : "";
          const at = a ? t.toLocaleLowerCase("tr-TR").indexOf(a.toLocaleLowerCase("tr-TR")) : -1;
          if (at >= 0) {
            h.append(t.slice(0, at));
            el("span", "accent", h, t.slice(at, at + a.length));
            h.append(t.slice(at + a.length));
          } else h.textContent = t;
          fit(h, sizes);
          h.dataset.qa = "text";
          return h;
        }
        // body text; **phrase** is drawn bold in neon (built with text nodes, never innerHTML)
        function body(parent, text, sizes) {
          if (!text) return null;
          const p = el("p", "t-body", parent);
          String(text).split(/\*\*(.+?)\*\*/).forEach((part, k) => {
            if (k % 2) el("span", "hi", p, part);
            else if (part) p.append(part);
          });
          p.dataset.qa = "text";
          fit(p, sizes || (STORY ? [46, 42, 38] : [40, 37, 34]));
          return p;
        }
        function kicker(parent, text) {
          if (!text) return null;
          const k = el("div", "kicker black", parent, up(text));
          k.dataset.qa = "text";
          return k;
        }
        const FIT = [];
        function fit(e, sizes) {
          e.style.fontSize = sizes[0] + "px";
          FIT.push({ e, sizes, i: 0 });
        }
        function brandMark(parent) {
          const m = el("div", "brand-mark black", parent);
          if (D.brand.logo) {
            m.classList.add("has-logo");
            el("img", "", m).src = D.brand.logo;
          } else m.textContent = up(String(D.brand.name || "?").trim().charAt(0));
          return m;
        }
        function phone(slide, imgSrc, css, withTags) {
          const p = el("div", "phone", slide);
          Object.assign(p.style, css);
          const s = el("div", "screen", p);
          el("img", "", s).src = imgSrc;
          p.dataset.obstacle = "1";
          if (withTags) {
            const d = el("div", "tag domain black", p, D.domain);
            Object.assign(d.style, { left: "-24px", top: "90px" });
            const m = el("div", "tag mark black", p, D.brand.handle);
            Object.assign(m.style, { right: "-20px", bottom: "120px" });
          }
          return p;
        }
        // A part of the site further down: fullpage.png is 1080 x fullpage_height, screens of 1920.
        function pageCard(slide, section, top, height) {
          const c = el("div", "pagecard", slide);
          Object.assign(c.style, { top: top + "px", height: height + "px" });
          const scale = (W - 160) / 1080;
          const maxOff = Math.max(0, D.fullpage_height * scale - height);
          // the renderer picks the busiest crop per section (page_offsets, source px)
          const picked = ((D.page_offsets || {})[STORY ? "story" : "carousel"] || {})[section];
          const off = Math.min(maxOff, (picked !== undefined ? picked : section * 1920 * 0.9) * scale);
          const img = el("img", "", c);
          img.src = "assets/fullpage.jpg";
          img.style.top = -off + "px";
          el("div", "fade", c);
          const m = el("div", "tag mark black", c, D.brand.handle);
          Object.assign(m.style, { right: "24px", bottom: "24px" });
          c.dataset.obstacle = "1";
          // domain tag straddles the card's top border, so it never covers the site's own text
          const d = el("div", "tag domain black", slide, D.domain);
          Object.assign(d.style, { left: "112px", top: top - 24 + "px", zIndex: 2 });
          const cr = el("div", "credit", slide, "Görsel: " + D.domain);
          cr.style.top = top + height + 12 + "px";
          cr.dataset.qa = "chrome";
          return c;
        }
        const icon = {
          save: '<svg width="96" height="96" viewBox="0 0 24 24" fill="#001018"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1z"/></svg>',
          saveS: '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1z"/></svg>',
          send: '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>',
        };

        // ---- background across the strip ----
        const orbs = document.getElementById("orbs");
        for (let i = 0; i < N + 1; i++) {
          const o = el("div", "orb", orbs);
          const big = i % 2 === 0;
          const size = big ? 1000 : 820;
          Object.assign(o.style, {
            width: size + "px",
            height: size + "px",
            left: i * W - size / 2 + (big ? 120 : -80) + "px",
            top: (big ? -0.25 : 0.55) * H + "px",
            background: big
              ? "radial-gradient(circle, rgba(10,124,255,.42), transparent 65%)"
              : "radial-gradient(circle, rgba(31,213,255,.28), transparent 65%)",
          });
        }
        const rail = document.getElementById("rail");
        Object.assign(rail.style, { width: N * W + "px", top: (STORY ? 1640 : H - 69) + "px" });

        // ---- frames ----
        const slidesEl = document.getElementById("slides");
        frames.forEach((f, i) => {
          const s = el("section", "slide", slidesEl);
          s.style.left = i * W + "px";
          s.dataset.index = i;

          // chrome
          const b = el("div", "brand black", s);
          brandMark(b);
          el("span", "", b, D.brand.handle);
          b.dataset.qa = "chrome";
          const ctr = el("div", "counter black", s, STORY ? i + 1 + "/" + N : String(i + 1).padStart(2, "0") + "/" + String(N).padStart(2, "0"));
          ctr.dataset.qa = "chrome";
          if (!STORY) {
            const pr = el("div", "progress", s);
            el("i", "", pr).style.width = ((i + 1) / N) * 100 + "%";
          }

          const c = el("div", "content", s);
          const role = f.role;
          const NEWS = D.kind === "news";

          if (NEWS && (role === "cover" || (STORY && role === "hook"))) {
            // the article's own image, full bleed, headline at the bottom
            // a wide image (most og:images are 1.91:1) would be cropped to its middle: show it whole
            // at the top over a blurred copy of itself; a tall one fills the frame
            const wide = (D.news.cover_ratio || 1) > 1.05;
            const ci = el("img", "cover-img" + (wide ? " cover-blur" : ""));
            ci.src = "assets/cover.jpg";
            s.prepend(el("div", "cover-shade"));
            const boxTop = STORY ? 340 : 110;
            const boxBottom = STORY ? 1510 : 1205;
            let top = boxTop;
            if (wide) {
              const fg = el("img", "cover-wide");
              fg.src = "assets/cover.jpg";
              const imgTop = STORY ? 330 : 128;
              fg.style.top = imgTop + "px";
              s.prepend(fg);
              // the headline may touch the image's shaded lower edge, never more: a 4-line headline used
              // to climb into the image (OpenAI / Itaú, 10-17). Less room makes fit() pick a smaller size.
              top = Math.max(boxTop, Math.round(imgTop + 1080 / D.news.cover_ratio - 40));
            }
            s.prepend(ci);
            c.classList.add("bottom");
            c.style.top = top + "px";
            c.style.height = boxBottom - top + "px";
            el("i", "hl-rule", c);
            // D-17 (research 2026-10-16): 3-6 big words, and a swipe cue on the feed cover
            title(c, f.title, "", STORY ? [104, 96, 88, 80, 72, 64] : [112, 100, 92, 84, 76, 68, 62], true);
            if (STORY && f.body) body(c, f.body);
            const cr = el("div", "credit", s, D.news.cover_credit || "Görsel: " + D.news.publisher);
            cr.style.top = (STORY ? 1530 : 1222) + "px";
            cr.dataset.qa = "chrome";
            if (!STORY) el("div", "swipe black", s, "KAYDIR →").dataset.qa = "chrome";
          } else if (NEWS && role === "news") {
            b.style.display = "none"; // the byline below carries the brand on these slides
            ctr.style.display = "none";
            const by = el("div", "byline", c);
            brandMark(by);
            const nm = el("div", "", by);
            if (D.brand.wordmark) el("img", "wordmark", nm).src = D.brand.wordmark;
            else el("div", "by-name black", nm, D.brand.name).dataset.qa = "chrome";
            el("div", "by-handle", nm, D.brand.handle).dataset.qa = "chrome";
            el("div", "by-date", by, String(i + 1).padStart(2, "0") + "/" + String(N).padStart(2, "0")).dataset.qa = "chrome";
            c.style.top = "80px";
            c.style.height = "1150px";
            const textOnly = f.visual === "none";
            // a text-only slide centres its text in the frame and sets it larger
            if (textOnly) el("div", "", c).style.flex = "1";
            if (f.title) title(c, f.title, "", textOnly ? [72, 64, 56, 48] : [60, 54, 48]);
            body(c, f.body, textOnly ? [48, 44, 40, 37, 34, 32] : [40, 38, 36, 34, 32, 30]).style.color = "var(--ink)";
            if (textOnly) el("div", "", c).style.flex = "1.3";
            if (!textOnly) {
              const card = el("div", "ncard" + (f.visual === "page" || f.visual === "cover" ? " fill" : ""), c);
              if (f.visual === "video") {
                card.dataset.videoSlot = String(f.visual_index);
                card.style.background = "#000";
                el("div", "tag vtag black", card, "▶ VİDEO");
              } else {
                const src = f.visual === "figure" ? (D.news.figures[f.visual_index - 1] || {}).src : f.visual === "page" ? "assets/page.jpg" : "assets/cover.jpg";
                el("img", "", card).src = src;
              }
              el("div", "tag mark black", card, D.brand.handle);
              // our own test outputs ("Biz denedik") carry their own credit instead of the publisher's
              const own = f.visual === "figure" ? (D.news.figures[f.visual_index - 1] || {}).credit
                : f.visual === "cover" && D.news.cover_credit;
              const cr = el("div", "ncredit", c, own || (f.visual === "video" ? "Video: " : "Görsel: ") + D.news.publisher + (D.news.date_label ? ", " + D.news.date_label : ""));
              cr.dataset.qa = "chrome";
            }
          } else if (NEWS && role === "why") {
            c.classList.add("center");
            kicker(c, "NEDEN ÖNEMLİ?");
            if (f.title && !/neden önemli/i.test(f.title)) title(c, f.title, "", [76, 68, 60]);
            body(c, f.body, [52, 48, 44, 40]).style.color = "var(--ink)";
            const g = el("div", "ghost black", s, "?");
            Object.assign(g.style, { right: "40px", top: "300px", fontSize: "900px" });
          } else if (NEWS && role === "cta") {
            c.classList.add("center");
            c.style.textAlign = "center";
            title(c, f.title, "", [88, 80, 72, 64]).style.textAlign = "center";
            const bd = body(c, f.body);
            if (bd) bd.style.textAlign = "center";
            const sign = el("div", "sign", c);
            brandMark(sign);
            const st = el("div", "sign-text", sign);
            if (D.brand.wordmark) {
              const w = el("img", "wordmark", st);
              w.src = D.brand.wordmark;
              Object.assign(w.style, { height: "50px", marginBottom: "10px" });
            }
            el("div", "sign-handle black", st, D.brand.handle).dataset.qa = "text";
            el("div", "sign-line", st, D.brand.follow_line).dataset.qa = "text";
            const fb = el("div", "follow-btn black", c);
            el("span", "", fb, "+");
            el("span", "", fb, "TAKİP ET");
          } else if (role === "hook") {
            const shot = f.visual !== "none";
            kicker(c, f.kicker);
            title(c, f.title, f.accent, STORY ? [124, 112, 100, 90] : [132, 120, 108, 96], true);
            body(c, f.body);
            if (shot && !STORY) {
              c.style.height = "470px";
              // crosses the seam into slide 2: the swipe-through cue
              phone(s, "assets/screenshot.jpg", { width: "500px", left: "650px", top: "660px", transform: "rotate(8deg)" }, false);
            } else if (shot) {
              c.style.height = "640px";
              phone(s, "assets/screenshot.jpg", { width: "520px", left: "280px", top: "1020px", transform: "rotate(-6deg)" }, true);
            } else c.classList.add("center");
            if (!STORY) {
              const sw = el("div", "swipe black", s, "KAYDIR  →");
              sw.style.left = "80px";
              sw.dataset.qa = "chrome";
            }
          } else if (role === "context") {
            kicker(c, f.kicker);
            title(c, f.title, f.accent, [88, 80, 72, 64]);
            body(c, f.body);
            const g = el("div", "ghost black", s, "?");
            Object.assign(g.style, { right: "40px", top: "520px", fontSize: "900px" });
            if (i === 1 && frames[0].visual !== "none") c.style.height = "560px";
            if (i === 1) {
              const sw = el("div", "swipe black", s, "KAYDIR  →");
              sw.style.right = "80px";
              sw.dataset.qa = "chrome";
            }
          } else if (role === "reveal") {
            const tc = el("div", "toolchip black", c);
            const lg = el("div", "logo black", tc);
            if (D.has_tool_logo) el("img", "", lg).src = "assets/logo.png";
            else lg.textContent = up(D.tool_name.charAt(0));
            el("span", "", tc, D.tool_name);
            tc.dataset.qa = "text";
            title(c, f.title, f.accent, [84, 76, 68, 60]);
            body(c, f.body);
            c.style.height = "500px";
            phone(s, "assets/screenshot.jpg", { width: "440px", left: "320px", top: "690px" }, true);
          } else if (role === "feature") {
            if (f.visual === "page" || f.visual === "screenshot") {
              // "01" as a big outlined numeral; a word kicker ("GİZLİLİK") as the normal pill
              if (/^\s*\d{1,2}\s*$/.test(f.kicker || "")) el("div", "num black", c, f.kicker.trim()).style.fontSize = "110px";
              else kicker(c, f.kicker);
              title(c, f.title, f.accent, STORY ? [84, 76, 68] : [72, 66, 60, 54]);
              body(c, f.body);
              if (STORY) {
                c.style.height = "540px";
                pageCard(s, f.visual === "page" ? f.page_section : 0, 920, 600);
              } else {
                c.style.height = "500px";
                pageCard(s, f.visual === "page" ? f.page_section : 0, 690, 520);
              }
            } else {
              c.classList.add("center");
              const card = el("div", "card", c);
              if (/^\s*\d{1,2}\s*$/.test(f.kicker || "")) el("div", "num black", card, f.kicker.trim());
              else kicker(card, f.kicker);
              title(card, f.title, f.accent, [84, 76, 68, 60]);
              el("i", "rule", card);
              body(card, f.body);
            }
          } else if (role === "fact") {
            kicker(c, f.kicker);
            title(c, f.title, f.accent, [88, 80, 72, 64]);
            body(c, f.body);
            if (f.visual !== "none") {
              c.style.height = "540px";
              pageCard(s, f.visual === "page" ? f.page_section : 0, 920, 600);
            } else c.classList.add("center");
          } else if (role === "stat") {
            c.classList.add("center");
            kicker(c, f.kicker);
            const st = el("div", "stat black", c, f.stat);
            st.dataset.qa = "text";
            fit(st, [240, 210, 180, 150, 120]);
            title(c, f.title, f.accent, [76, 68, 60]);
            body(c, f.body);
            const g = el("div", "ghost black", s, "%");
            Object.assign(g.style, { right: "-60px", bottom: "40px", fontSize: "700px", opacity: 0.6 });
          } else if (role === "compare") {
            c.classList.add("center");
            kicker(c, f.kicker);
            title(c, f.title, f.accent, [76, 68, 60, 54]);
            const cols = el("div", "cols", c);
            [
              [f.items, "ESKİ YOL", false],
              [f.items_right, up(D.tool_name) + " İLE", true],
            ].forEach(([items, head, good]) => {
              const col = el("div", "col" + (good ? " good" : ""), cols);
              const hd = el("div", "col-head black", col, head);
              hd.dataset.qa = "text";
              items.forEach((t) => {
                const li = el("div", "li", col);
                el("span", "ic black " + (good ? "yes" : "no"), li, good ? "✓" : "✕");
                el("span", "", li, t).dataset.qa = "text";
              });
            });
          } else if (role === "recap") {
            c.classList.add("center");
            kicker(c, f.kicker);
            title(c, f.title, f.accent, [88, 80, 72]);
            const list = el("div", "checks", c);
            f.items.forEach((t) => {
              const li = el("div", "li", list);
              el("span", "ic black yes", li, "✓");
              el("span", "", li, t).dataset.qa = "text";
            });
          } else if (role === "cta") {
            c.classList.add("center");
            c.style.textAlign = "center";
            const ic = el("div", "cta-icon", c);
            ic.innerHTML = icon.save;
            const h = title(c, f.title, f.accent, [104, 92, 84, 76]);
            h.style.textAlign = "center";
            const bd = body(c, f.body);
            if (bd) bd.style.textAlign = "center";
            const acts = el("div", "cta-actions", c);
            [
              [icon.saveS, "KAYDET"],
              [icon.send, "GÖNDER"],
            ].forEach(([svg, label]) => {
              const p = el("div", "pill black", acts);
              p.innerHTML = svg;
              el("span", "", p, label);
            });
            const sign = el("div", "sign", c);
            brandMark(sign);
            const st = el("div", "sign-text", sign);
            if (D.brand.wordmark) {
              const w = el("img", "wordmark", st);
              w.src = D.brand.wordmark;
              Object.assign(w.style, { height: "50px", marginBottom: "10px" });
            }
            el("div", "sign-handle black", st, D.brand.handle).dataset.qa = "text";
            el("div", "sign-line", st, D.brand.follow_line).dataset.qa = "text";
          } else if (role === "poll") {
            kicker(c, f.kicker);
            title(c, f.title, f.accent, [104, 92, 84, 76]);
            body(c, f.body);
            c.style.height = "680px";
            const hint = el("div", "hint black", s, "↓  OY VER");
            hint.style.top = "1060px";
            hint.dataset.qa = "chrome";
            const z = el("div", "zone-glow", s);
            Object.assign(z.style, { top: "1140px", height: "320px" });
          } else if (role === "link") {
            kicker(c, f.kicker);
            title(c, f.title, f.accent, [96, 88, 80, 72]);
            body(c, f.body);
            c.style.height = "640px";
            const hint = el("div", "hint black", s, "↓  LİNKE DOKUN");
            hint.style.top = "1040px";
            hint.dataset.qa = "chrome";
            const z = el("div", "zone-glow", s);
            Object.assign(z.style, { top: "1120px", height: "240px" });
            const sign = el("div", "sign story-sign", s);
            brandMark(sign);
            const st = el("div", "sign-text", sign);
            if (D.brand.wordmark) {
              const w = el("img", "wordmark", st);
              w.src = D.brand.wordmark;
              Object.assign(w.style, { height: "50px", marginBottom: "10px" });
            }
            el("div", "sign-handle black", st, D.brand.handle).dataset.qa = "text";
            el("div", "sign-line", st, D.brand.follow_line).dataset.qa = "text";
          }
        });

        // ---- show one frame ----
        window.__show = function (i) {
          strip.style.transform = "translateX(" + -i * W + "px)";
        };

        // ---- fit, then measure ----
        function overflowing(slide) {
          const c = slide.querySelector(".content");
          if (c.scrollHeight > c.clientHeight + 1) return true;
          return [...slide.querySelectorAll("[data-qa]")].some((e) => e.scrollWidth > e.clientWidth + 1);
        }
        function fitAll() {
          document.querySelectorAll(".slide").forEach((slide) => {
            const items = FIT.filter((f) => slide.contains(f.e));
            for (let guard = 0; guard < 40 && overflowing(slide); guard++) {
              // step down the element that is still at the largest size it allows
              const next = items.filter((f) => f.i < f.sizes.length - 1).sort((a, b) => b.sizes[b.i] - a.sizes[a.i])[0];
              if (!next) break;
              next.i++;
              next.e.style.fontSize = next.sizes[next.i] + "px";
            }
          });
        }

        function lum(rgb) {
          const c = rgb.map((v) => {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
        }
        function parseColor(s) {
          const m = String(s).match(/rgba?\(([^)]+)\)/);
          if (!m) return null;
          const p = m[1].split(",").map((x) => parseFloat(x));
          return { rgb: p.slice(0, 3), a: p.length > 3 ? p[3] : 1 };
        }
        // Background behind an element: the first ancestor with an opaque-enough fill; else the page bg.
        function bgOf(e) {
          for (let n = e; n && n !== strip; n = n.parentElement) {
            const c = parseColor(getComputedStyle(n).backgroundColor);
            if (c && c.a >= 0.5) return c.rgb;
          }
          return [4, 6, 12];
        }
        function measure() {
          const problems = [];
          const slides = [...document.querySelectorAll(".slide")];
          slides.forEach((slide, i) => {
            const x0 = i * W;
            const label = (STORY ? "story frame " : "slide ") + (i + 1);
            const c = slide.querySelector(".content");
            if (c.scrollHeight > c.clientHeight + 1)
              problems.push({ frame: i, kind: "overflow", msg: label + ": text is " + (c.scrollHeight - c.clientHeight) + "px too tall for the layout" });
            const obstacles = [...slide.querySelectorAll("[data-obstacle]")].map((o) => o.getBoundingClientRect());
            const safe = STORY ? { l: 80, r: 1000, t: 250, b: 1580 } : { l: 72, r: 1008, t: 40, b: 1310 };
            slide.querySelectorAll("[data-qa]").forEach((e) => {
              const r = e.getBoundingClientRect();
              if (!r.width || !r.height) return;
              const text = e.textContent.trim().slice(0, 40);
              const cs = getComputedStyle(e);
              const fs = parseFloat(cs.fontSize);
              const min = e.dataset.qa === "chrome" ? MIN_CHROME : MIN_FONT;
              if (fs < min - 0.1) problems.push({ frame: i, kind: "small", msg: label + ": '" + text + "' is " + fs + "px, min " + min });
              if (e.scrollWidth > e.clientWidth + 1) problems.push({ frame: i, kind: "overflow", msg: label + ": '" + text + "' is too wide (a word is too long)" });
              const L = r.left - x0, R = r.right - x0;
              if (L < safe.l - 1 || R > safe.r + 1 || r.top < safe.t - 1 || r.bottom > safe.b + 1)
                problems.push({ frame: i, kind: "safe_zone", msg: label + ": '" + text + "' leaves the safe zone" });
              if (e.dataset.qa === "text" && !e.closest("[data-obstacle]"))
                obstacles.forEach((o) => {
                  const ix = Math.min(r.right, o.right) - Math.max(r.left, o.left);
                  const iy = Math.min(r.bottom, o.bottom) - Math.max(r.top, o.top);
                  if (ix > 2 && iy > 2) problems.push({ frame: i, kind: "collision", msg: label + ": '" + text + "' runs into the screenshot" });
                });
              const fg = parseColor(cs.color);
              if (fg) {
                const L1 = lum(fg.rgb), L2 = lum(bgOf(e));
                const ratio = (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
                if (ratio < 4.5) problems.push({ frame: i, kind: "contrast", msg: label + ": '" + text + "' contrast " + ratio.toFixed(1) + ":1, min 4.5" });
              }
            });
          });
          return problems;
        }

        async function ready() {
          await document.fonts.load('900 64px "HF Black"', "İĞŞÇÖÜığşçöü");
          await document.fonts.load('600 40px "HF Semi"', "İĞŞÇÖÜığşçöü");
          await document.fonts.ready;
          const fontsOk = document.fonts.check('900 64px "HF Black"', "İĞŞ") && document.fonts.check('600 40px "HF Semi"', "İĞŞ");
          await Promise.all(
            [...document.images].map((im) =>
              im.decode().catch(() => {
                im.dataset.broken = "1";
              }),
            ),
          );
          fitAll();
          const qa = measure();
          if (!fontsOk) qa.push({ frame: -1, kind: "fonts", msg: "brand fonts did not load" });
          [...document.images].filter((im) => im.dataset.broken).forEach((im) => qa.push({ frame: -1, kind: "image", msg: "image failed to load: " + im.getAttribute("src") }));
          window.__qa = qa;
          window.__show(0);
          window.__ready = true;
        }
        ready();
      })();
    </script>
  </body>
</html>
