<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KAVAR icon: the wordmark's K (stem + chevron, tip on the stem), chevron in neon.
       Reads at 24 px; the tile is the brand's dark ground. -->
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FD5FF"/>
      <stop offset="1" stop-color="#0A7CFF"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.25" cy="0.15" r="1.1">
      <stop offset="0" stop-color="#0E1D3A"/>
      <stop offset="0.65" stop-color="#04060C"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the wordmark's K scaled x2.6 around the tile centre: stem 0..18, chevron to 72, height 100 -->
  <g transform="translate(162 126) scale(2.6)">
    <rect x="0" y="0" width="18" height="100" fill="#F4F8FF"/>
    <path fill="url(#neon)" filter="url(#glow)" d="M72 0 H49 L16 50 L49 100 H72 L39 50 Z"/>
  </g>
</svg>
